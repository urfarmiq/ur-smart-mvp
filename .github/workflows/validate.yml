name: Validate UR Smart

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node for pinned DEM decoder tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: satellite-backend/package-lock.json
      - name: Install pinned DEM decoder dependencies
        run: npm ci --prefix satellite-backend --ignore-scripts
      - name: Check core functions and pages
        run: |
          node --test tests/*.test.mjs
          python3 tests/check_pages.py
          python3 -m py_compile tests/browser_satellite.py tests/browser_management.py tests/browser_weather.py tests/browser_admin.py tests/browser_auth.py tests/browser_visits.py tests/browser_login_recovery.py tests/browser_local_sdk.py tests/browser_research_lab.py tests/browser_research_image.py tests/browser_farm_budget.py tests/browser_weather_session.py tests/browser_plant_health.py tests/browser_field_services.py tests/browser_admin_field_services.py tests/browser_satellite_access.py tests/browser_admin_satellite_access.py tests/browser_products.py tests/browser_admin_products.py tests/browser_pwa.py tests/browser_advertise.py tests/browser_admin_advertising.py tests/browser_public_ads.py tests/browser_planting_calendar.py tests/browser_terrain.py
