name: Deploy UR Smart Satellite Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "satellite-backend/**"
      - "advisor-handoff.mjs"
      - ".github/workflows/deploy-satellite-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-satellite-worker
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate core functions and pages
        run: |
          node --test tests/*.test.mjs
          python3 tests/check_pages.py
          python3 -m py_compile tests/browser_satellite.py tests/browser_management.py

      - name: Check Cloudflare deployment access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node satellite-backend/check-deploy-access.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: satellite-backend
          wranglerVersion: "4"
          command: deploy worker.js --name ur-smart-satellite --compatibility-date 2026-10-22 --keep-vars

